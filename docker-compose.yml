services:
  db:
    image: postgres:15-alpine
    container_name: splitmoney-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - splitmoney-network

  api:
    build: .
    container_name: splitmoney-api
    restart: unless-stopped
    ports:
      - '${PORT}:3000'
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - splitmoney-network

networks:
  splitmoney-network:
    driver: bridge

volumes:
  postgres_data:
