services:
  db:
    image: postgres:15-alpine
    container_name: splitmoney-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: splitmoney
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - splitmoney-network

  api:
    build: .
    container_name: splitmoney-api
    restart: always
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/splitmoney?schema=public
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - JWT_EXPIRES_IN=7d
      - PORT=3000
      - NODE_ENV=development
      - GOOGLE_CLIENT_ID=1019339763552-o5h12eg8q9m0jupsuesjc2201vr5hfon.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=***REMOVED***
      - GOOGLE_CALLBACK_URL=http://localhost:3000/auth/google/callback
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - db
    networks:
      - splitmoney-network

networks:
  splitmoney-network:
    driver: bridge

volumes:
  postgres_data:
