version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: splitmoney-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - splitmoney-network
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build: .
    container_name: splitmoney-api
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    depends_on:
      - db
    networks:
      - splitmoney-network

  nginx:
    image: nginx:alpine
    container_name: splitmoney-api-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - splitmoney-network

networks:
  splitmoney-network:
    driver: bridge

volumes:
  postgres_data:
